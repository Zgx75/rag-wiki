</style></head><body><a class="skip" href="#main">跳到內容</a><header><a class="brand" href="#home"><span class="brand-icon">R</span><span>RAG<span class="brand-small">學習實驗室</span></span></a><nav aria-label="主要導覽"><a href="#slides/1" data-section="slides">教學簡報</a><a href="#wiki" data-section="wiki">LLM Wiki</a><a href="#flow" data-section="flow">工作流程</a><a href="#report" data-section="report">執行與反思</a><a href="#sources" data-section="sources">來源</a></nav><span class="header-label">LLM WIKI PROJECT · 2026</span></header><main id="main" tabindex="-1"></main><footer class="site-footer"><span>從資料到理解，每一步都留有來源。</span><span>6 篇來源 / 8 個概念 / 15 頁教學</span></footer><noscript>請開啟 JavaScript 瀏覽簡報與 Wiki；完整 Markdown 與紀錄亦收錄在作業包。</noscript><script>const DATA={"brief":{"topic":"RAG 入門：讓 AI 查資料再回答","audience":"第一次接觸 RAG 的大學生","goals":["用自己的話解釋 RAG","分辨檢索失敗與生成失敗","檢查引用是否支持回答"],"scope":"用校園問答說明基礎概念、檢索與證據追溯；不提供真實校務規章。","discussion":[{"speaker":"AI 主題與範圍提案","text":"以你做過的 RAG 專案為背景，建議 RAG 入門，用校園問答說明檢索、生成與引用，以六篇原始論文建立 Wiki。其他選項是 AI Agents 入門與 LLM 幻覺查核。"},{"speaker":"使用者選擇（生成前）","text":"使用者於本次對話的主題選單選擇「RAG 入門（Recommended）」。"},{"speaker":"採用的教學規格","text":"對象為初學者。先閱讀六篇第一手論文的摘要與書目，建立來源筆記與八個概念頁，再從 Wiki 產生十五頁 HTML 簡報。保留來源對照、流程、實際紀錄與反思。"},{"speaker":"生成前檢查重點","text":"研究主張必須回到原始來源，虛構校園公告須明確標示。結構檢查與語意審查分開；四個邊界案例屬受控測試，不當成自然錯誤率。"}]},"sources":[{"id":"S01","short":"Lewis et al. · NeurIPS 2020","title":"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks","url":"https://arxiv.org/abs/2005.11401","year":2020,"venue":"NeurIPS 2020；arXiv v4 修訂於 2021","authors":"Patrick Lewis et al.","locator":"arXiv Abstract，關於 parametric / non-parametric memory 的句子","note":"RAG 將參數式語言模型與外部非參數式記憶結合；原論文使用 Wikipedia 稠密向量索引與神經檢索器。","limit":"原始 RAG 有特定訓練配方；本作業的查資料比喻用來入門，不等同重現原模型。","concepts":["W01","W04"],"checkedDate":"2026-11-18"},{"id":"S02","short":"Karpukhin et al. · EMNLP 2020","title":"Dense Passage Retrieval for Open-Domain Question Answering","url":"https://aclanthology.org/2020.emnlp-main.550/","year":2020,"venue":"EMNLP 2020","authors":"Vladimir Karpukhin et al.","locator":"ACL Abstract，第一段的 dual-encoder framework","note":"DPR 以雙編碼器學習問題與段落的稠密表示，利用表示進行段落檢索。","limit":"段落檢索的相似性與最終回答正確性是不同問題；論文結果有指定資料集與比較基準。","concepts":["W03"],"checkedDate":"2026-11-18"},{"id":"S03","short":"Gao et al. · EMNLP 2023","title":"Enabling Large Language Models to Generate Text with Citations","url":"https://aclanthology.org/2023.emnlp-main.398/","year":2023,"venue":"EMNLP 2023","authors":"Tianyu Gao, Howard Yen, Jiatong Yu, Danqi Chen","locator":"ACL Abstract，第二段的 fluency, correctness, citation quality","note":"ALCE 將含引用文字的評估拆成流暢度、正確性與引用品質；引用需要對應支持內容。","limit":"附上引用本身不是正確性的證明；本作業沒有重跑 ALCE 基準。","concepts":["W04","W05","W07"],"checkedDate":"2026-11-18"},{"id":"S04","short":"Liu et al. · TACL 2024","title":"Lost in the Middle: How Language Models Use Long Contexts","url":"https://aclanthology.org/2024.tacl-1.9/","year":2024,"venue":"TACL 12, 157–173","authors":"Nelson F. Liu et al.","locator":"ACL Abstract，第一及第二段的任務與位置效應","note":"在論文的多文件問答與鍵值檢索測試中，相關資訊的位置影響受測模型表現；資訊位於長上下文中段時表現下降。","limit":"不能由此宣稱所有模型、任務和長度都有相同結果；本作業使用正式出版年 2024，預印本為 2023。","concepts":["W06"],"checkedDate":"2026-11-18"},{"id":"S05","short":"Es et al. · EACL Demo 2024","title":"RAGAs: Automated Evaluation of Retrieval Augmented Generation","url":"https://aclanthology.org/2024.eacl-demo.16/","year":2024,"venue":"EACL 2024, System Demonstrations","authors":"Shahul Es, Jithin James, Luis Espinosa Anke, Steven Schockaert","locator":"ACL Abstract，第一至第三段的評估面向","note":"RAGAs 提出無參考答案的 RAG 評估框架，關注檢索情境、忠實使用情境與生成品質等面向。","limit":"自動評估的分數不等同人工確認所有事實。本作業未安裝或執行 RAGAs。","concepts":["W07"],"checkedDate":"2026-11-18"},{"id":"S06","short":"Asai et al. · arXiv 2023","title":"Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection","url":"https://arxiv.org/abs/2310.11511","year":2023,"venue":"arXiv 預印本 2310.11511（2023）","authors":"Akari Asai, Zeqiu Wu, Yizhong Wang, Avirup Sil, Hannaneh Hajishirzi","locator":"arXiv Abstract，第三段的 reflection tokens","note":"Self-RAG 以訓練過的反思 token，讓模型按需檢索，並反思取得的段落與生成內容。","limit":"在普通提示詞加上請反思，不等同實作 Self-RAG；本作業只借鏡檢查與回退的設計概念。","concepts":["W08"],"checkedDate":"2026-11-18"}],"wiki":[{"id":"W01","title":"RAG 是什麼？","tag":"起點","summary":"把外部資料帶入生成過程，讓回答能依據取得的內容。","sources":["S01"],"links":["W02","W03","W04"],"blocks":[["核心概念","RAG 是 Retrieval-Augmented Generation，中文為檢索增強生成。入門可把它理解為先找到相關資料，再把問題與資料一起交給語言模型。原始研究結合參數式與非參數式記憶。"],["教學比喻（本作業設計）","像開書考試：查到正確章節後，仍要讀懂題目並寫對答案。開書不是滿分保證。"],["辨識界線","本成果是一個以 LLM 整理的 Wiki 與教學簡報；網頁本身沒有呼叫線上 LLM，也沒有部署向量資料庫。"]]},{"id":"W02","title":"LLM Wiki 如何建立？","tag":"資料整理","summary":"將來源轉成可更新、可連結、可追溯的知識頁。","sources":[],"links":["W01","W05","W08"],"blocks":[["本作業定義","LLM Wiki 指由 LLM 協助整理的持久知識頁；這是本作業採用的工作定義。它不等同把網址存進清單。"],["Ingest 規格","讀取六篇第一手論文的摘要與書目，保留 URL、出版年、擷取位置、重述筆記與限制，再綜整成八個概念頁。未宣稱擷取論文全文。"],["更新規則","每筆資料一個 S 編號；每個概念頁一個 W 編號；新資料改變說法時，同步更新頁面、證據卡與受影響投影片。腳本只執行已整理內容的匯入與檢查，不重新呼叫 LLM。"]]},{"id":"W03","title":"如何找到相關段落？","tag":"檢索","summary":"問題與段落的表示可用於找出候選資料；候選仍需檢查。","sources":["S02"],"links":["W01","W06","W07"],"blocks":[["研究概念","DPR 使用雙編碼器，分別把問題與段落轉成稠密表示，再進行段落檢索。"],["本頁的互動示範","教學網頁用關鍵詞匹配來演示篩選相關筆記，並非 DPR、embedding 或語意檢索。搜尋不到時顯示無結果，不捏造答案。"],["本作業的檢查規則","檢索後核對主題、來源與使用範圍。Top-k 的 k 只是取幾個候選，不代表有幾個正確答案。"]]},{"id":"W04","title":"從證據到回答","tag":"生成","summary":"先建立主張與證據對照，再改寫成新手看得懂的文字。","sources":["S01","S03"],"links":["W03","W05","W07"],"blocks":[["概念","生成器使用問題與取得的內容產生回答；引用評估還要檢查輸出與證據之間的關係。"],["本作業操作","每張投影片先選 Wiki 頁，再選證據卡 C 編號；研究說法附來源，自創類比、操作規則與虛構案例另行標示。"],["虛構校園案例","問題：圖書館週末開到幾點？假設公告 K01 寫星期六 18:00 閉館、K02 寫星期日 17:00 閉館，回答就依兩筆公告整理並引用；不能新增 24 小時開放的說法。這些時間是教學虛構資料，並非政大規章。"]]},{"id":"W05","title":"有引用不等於有支持","tag":"查核","summary":"引用存在、引用正確、證據涵蓋完整，是不同檢查。","sources":["S03"],"links":["W04","W07","W08"],"blocks":[["研究依據","ALCE 分開評估流暢度、正確性與引用品質，因此讀起來順暢和附有來源都不足以單獨證明內容正確。"],["本作業三個問題","來源編號存在嗎？原文是否支持這句話？句子的適用範圍是否超過原文？"],["回退規則","沒有支持就刪除主張或標記資料不足；不能為了湊投影片，把不相關來源接在句尾。"]]},{"id":"W06","title":"資料更多就更好嗎？","tag":"限制","summary":"長上下文中的資訊位置，是受測模型表現的影響因素。","sources":["S04"],"links":["W03","W05","W07"],"blocks":[["研究結果","Lost in the Middle 在多文件問答及鍵值檢索任務中，觀察到相關資訊位置造成表現差異，中段資訊的使用較差。"],["適用範圍","此結果描述論文受測的模型、資料與設定；不能推出所有當代模型都一定有同幅度下降。"],["本作業設計推論","因此在簡報產生前，先選擇相關證據並去除重複筆記。這是設計選擇，沒有在本作業中量測其效能提升。"]]},{"id":"W07","title":"怎麼評估 RAG？","tag":"評估","summary":"分開看找得對、用得對、答得好，才知道該修哪個節點。","sources":["S03","S05"],"links":["W03","W05","W08"],"blocks":[["研究依據","RAGAs 關注檢索情境、忠實使用資料與生成品質；ALCE 則針對含引用文字評估流暢度、正確性及引用品質。"],["本作業檢查","結構檢查驗證編號與連結；證據審查檢查主張是否超出來源；瀏覽器檢查操作、手機版與頁面顯示。"],["限制","本次檢查不是研究基準測試。編號全通過不代表語意已被程式自動證實，語意仍由本次 AI 審查並保留判斷理由。"]]},{"id":"W08","title":"為什麼需要 loop？","tag":"工作流程","summary":"把錯誤送回能修正它的節點，並設停止條件。","sources":["S06"],"links":["W02","W05","W07"],"blocks":[["研究啟發","Self-RAG 的模型按需檢索並反思段落與生成；本作業借鏡其回饋精神，沒有重現該模型訓練。"],["本作業 graph","來源檢查失敗回取得資料；證據不足回 Wiki 查詢或縮小主張；顯示問題回 HTML 版面。每類最多修正兩輪，仍無支持就移除主張並記錄。"],["為何往前移","先通過證據卡審查再排版，避免把同一個錯誤散佈到投影片、講稿和作業報告。這是本次採用的設計理由。"]]}],"claims":[{"id":"C01","wiki":"W01","sources":["S01"],"text":"RAG 結合語言模型與外部知識檢索。","support":"S01 摘要說明參數式與非參數式記憶的結合。"},{"id":"C02","wiki":"W03","sources":["S02"],"text":"DPR 使用問題與段落的稠密表示來檢索段落。","support":"S02 摘要明示雙編碼器與 dense representations。"},{"id":"C03","wiki":"W05","sources":["S03"],"text":"引用的品質與回答的正確性需要分別檢查。","support":"S03 摘要將 correctness 與 citation quality 列為不同評估面向。"},{"id":"C04","wiki":"W06","sources":["S04"],"text":"在該研究的受測設定中，相關資訊的位置影響模型表現。","support":"S04 摘要說明位置變動及兩個受測任務，保留研究範圍。"},{"id":"C05","wiki":"W07","sources":["S05"],"text":"RAG 評估要兼顧檢索、忠實使用情境與生成品質。","support":"S05 摘要列出這三類評估考量。"},{"id":"C06","wiki":"W08","sources":["S06"],"text":"Self-RAG 使用訓練過的反思 token 進行按需檢索與反思。","support":"S06 摘要說明訓練與 reflection tokens；本作業未實作其模型。"}],"auditCases":[{"id":"T01","stage":"主張整理","candidate":"只要加上引用，回答就一定正確。","source":"S03","verdict":"reject","reason":"ALCE 分別評估正確性及引用品質；摘要不支持正確性保證。","repair":"改為 C03，區分引用與正確性。"},{"id":"T02","stage":"主張整理","candidate":"所有 LLM 都無法使用長上下文中段的資訊。","source":"S04","verdict":"reject","reason":"把特定模型與任務的觀察，擴張成所有模型皆無法使用，超出摘要支持範圍。","repair":"改為 C04，保留受測設定與位置影響。"},{"id":"T03","stage":"主張整理","candidate":"DPR 使用問題與段落的稠密表示來檢索段落。","source":"S02","verdict":"pass","reason":"S02 摘要明示雙編碼器與 dense representations。","repair":"保留 C02。"},{"id":"T04","stage":"主張整理","candidate":"Self-RAG 使用訓練過的反思 token 進行按需檢索與反思。","source":"S06","verdict":"pass","reason":"S06 摘要說明訓練與 reflection tokens；本作業未實作其模型。","repair":"保留 C06；註明未實作 Self-RAG。"}],"slides":[{"id":"P01","type":"hero","label":"從一個問題開始","title":"AI 回答得很流暢，\n你怎麼知道有根據？","subtitle":"RAG 入門：讓 AI 查資料再回答","wiki":["W01"],"claims":["C01"],"notes":"請同學先想一個 AI 答得很肯定，但自己無法核對的例子。這堂課的目標是理解證據如何進入回答，不是記住工具名稱。"},{"id":"P02","type":"objectives","label":"學習目標","title":"這堂課，學會三件事","items":[["說清楚","RAG 如何把資料帶進回答。"],["找問題","分辨找錯資料與讀錯資料。"],["看證據","核對引用是否支持主張。"]],"wiki":["W01","W07"],"claims":["C01","C05"],"notes":"學習順序是概念、操作、查核。三項目標也是後面小測驗的判斷標準。"},{"id":"P03","type":"rag","label":"01 / 基本概念","title":"先查資料，再組織回答","subtitle":"RAG = Retrieval-Augmented Generation","wiki":["W01","W03","W04"],"claims":["C01","C02"],"notes":"先把問題交給檢索器找候選資料，再由生成器使用問題與資料作答。這是入門流程；原始 RAG 論文有特定訓練方式。"},{"id":"P04","type":"compare","label":"02 / 知識庫","title":"Wiki 管知識，RAG 用知識","wiki":["W01","W02"],"claims":["C01"],"notes":"LLM Wiki 是這份作業對知識整理方式的定義。Wiki 持久保存來源與概念；RAG 描述把檢索結果帶進生成。兩者能配合，但不是同一件事。"},{"id":"P05","type":"ingest","label":"03 / 建立 Wiki","title":"六篇資料，整理成八個概念","wiki":["W02","W05"],"claims":["C03"],"notes":"實際 ingest 的是六篇論文的摘要與書目，不是下載全文。每篇都有來源編號、重述摘要和限制，之後才跨來源整理。"},{"id":"P06","type":"retrieve","label":"04 / 動手找資料","title":"找得到，不代表用得對","subtitle":"試著搜尋「引用」「長上下文」或「檢索」。","wiki":["W03","W06"],"claims":["C02","C04"],"notes":"這裡是關鍵詞匹配示範，沒有 embedding 或線上 LLM。找出候選頁以後，仍需閱讀原始來源的適用範圍。"},{"id":"P07","type":"example","label":"05 / 從資料到回答","title":"只說紀錄支持的事情","subtitle":"教學用虛構校園公告，並非政大規章或實際系統評估。","wiki":["W04","W05"],"claims":["C03"],"notes":"請指出：週六 18:00、週日 17:00 是虛構公告中的資料；24 小時開放是沒有證據的新增細節。案例說明忠實使用來源，並非真實圖書館營業時間。"},{"id":"P08","type":"citation","label":"06 / 引用查核","title":"有連結，還不夠","items":[["存在","來源編號真的存在嗎？"],["支持","來源真的說了這件事嗎？"],["範圍","有沒有把局部結果說成通則？"]],"wiki":["W05","W06"],"claims":["C03","C04"],"notes":"正確的網址也能被接在錯誤的主張後面。結構檢查只處理存在；支持與範圍需要語意審查。"},{"id":"P09","type":"limit","label":"07 / 常見誤解","title":"更多資料 ≠ 更好的回答","wiki":["W06"],"claims":["C04"],"notes":"研究在指定模型與任務中觀察到資訊位置的影響，不能推論所有模型都無法利用中段資訊。本作業選擇先篩選證據，但沒有量測這樣做的改善幅度。"},{"id":"P10","type":"evaluation","label":"08 / 分開評估","title":"錯在哪一層，就修哪一層","items":[["找得對","檢索：取得的資料與問題相關嗎？"],["用得對","忠實：回答有沒有超出資料？"],["答得好","輸出：是否回答問題、便於理解？"]],"wiki":["W07","W05"],"claims":["C05","C03"],"notes":"這三個教學問題參考 RAGAs 的評估面向；網頁未執行 RAGAs，也沒有提供未量測的準確率。"},{"id":"P11","type":"quiz","label":"09 / 檢查理解","title":"這個回答，問題在哪裡？","wiki":["W05","W06","W07"],"claims":["C03","C04","C05"],"notes":"完成三個小題後再看解說。如果錯在引用範圍，回 W05；如果混淆找不到與編造，回 W07。"},{"id":"P12","type":"flow","label":"10 / 本次工作流程","title":"先審證據，再做投影片","wiki":["W02","W08"],"claims":["C06"],"notes":"這是本作業設計的工作流程，不是 Self-RAG 的實作。失敗分流回最接近根因的節點，最多修兩輪，仍不通過就移除主張。"},{"id":"P13","type":"run","label":"11 / 實際執行","title":"留下可追溯的檢查紀錄","wiki":["W02","W05","W07"],"claims":["C03","C05"],"notes":"本頁由執行產物讀取數量。四個主張邊界案例是受控測試；不能當成模型日常錯誤率。正式六張證據卡另有逐卡判斷理由。"},{"id":"P14","type":"reflection","label":"12 / 反思與修正","title":"最值得提前的，是範圍檢查","wiki":["W05","W06","W08"],"claims":["C03","C04","C06"],"notes":"本次實際取得來源時遇到一個會議頁逾時，改用作者 arXiv 頁後完成。受控測試中兩項過度概括都在主張整理被退回；樣本不足以推論長期錯誤頻率。"},{"id":"P15","type":"end","label":"帶走這個判斷方法","title":"先問：這句話的證據在哪裡？","subtitle":"問題 → 相關資料 → 有根據的回答 → 引用與範圍檢查","wiki":["W01","W05","W07"],"claims":["C01","C03","C05"],"notes":"請同學用一句話解釋 RAG，再用另一句說明為什麼有引用不等於正確。最後可開啟 Wiki 逐頁查詢六篇原始來源。"}],"actualFailure":null,"browserCheck":{"at":"2026-11-17T16:22:23.955Z","status":"unverified","observed":["內建瀏覽器回傳 Tab 1 is not part of browser session，無法建立作業預覽分頁。","本地伺服器啟動，但 HTTP 預覽請求受到環境連線限制。","原生瀏覽器檢查遇到使用者正在操作的狀態，停止輸入；未完成對本作業頁面的操作驗證。"],"passed":[],"notTested":["15 頁實際視覺排版","瀏覽器內實際點擊與鍵盤切頁","手機實機","全螢幕","列印預覽"],"separateChecks":"Node VM 35 項字串渲染與互動邏輯通過；另有 13 項結構檢查通過。兩者不等同瀏覽器驗證。"},"run":{"started":"2026-11-17T16:25:26.054Z","completed":"2026-11-17T16:25:26.071Z","sourceCou function home(){return `<div class="home"><div class="home-grid"><div><div class="eyebrow">有來源的學習，從這裡開始</div><h1>讓 AI 的回答，<br>有<span><em>跡可循。</em></span></h1><p class="home-intro">從六篇研究出發，理解 RAG 如何找到資料、整理回答，以及為什麼「有引用」還需要查核。</p><div class="actions"><a class="btn primary" href="#slides/1">開始教學 <span>↗</span></a><a class="btn" href="#wiki">探索 LLM Wiki <span>→</span></a></div></div><div class="book-art" aria-label="從來源經由知識庫整理成回答的示意"><div class="art-label">QUESTION → KNOWLEDGE → ANSWER</div><div class="art-question">「這個回答，根據什麼？」</div><div class="art-docs"><div class="art-doc"><b>01 / 原始來源</b><br>六篇第一手研究<div class="doc-lines"></div></div><div class="art-doc"><b>02 / LLM Wiki</b><br>概念與證據連結<div class="doc-lines"></div></div><div class="art-doc"><b>03 / 教學簡報</b><br>理解、練習、查核<div class="doc-lines"></div></div></div><div class="art-answer">每一個研究主張，都能回到 Wiki 與原始資料。</div></div></div><div class="stat-row"><div class="stat"><strong>06</strong>已匯入的研究來源</div><div class="stat"><strong>08</strong>互相連結的概念頁</div><div class="stat"><strong>15</strong>教學投影片</div><div class="stat"><strong>03</strong>即時回饋的小測驗</div></div><div class="home-bottom"><div><div class="eyebrow">這份作業做了什麼</div><p>先定義範圍，再由 AI 閱讀來源摘要與書目、整理 Wiki，最後產生教學內容。成果包含可追溯的來源鏈、工作流程及本次檢查紀錄。</p><a href="#report">查看完整作業與反思 →</a></div><div><div class="eyebrow">閱讀方式</div><p>新手從簡報開始；想核對細節就點投影片底部的 Wiki 或來源編號。簡報支援方向鍵、講者筆記、全螢幕及列印。</p><span class="tag">繁體中文</span><span class="tag">單檔 HTML</span><span class="tag">無外部套件</span><span class="tag">離線可讀</span></div></div></div>`;}
function flowCards(){return `<div class="flow-top"><span>來源</span>→<span>Wiki</span>→<span>證據閘門</span>→<span>HTML</span></div><div class="flow-grid"><div class="flow-step"><strong>01 · 取得並匯入資料</strong><span>摘要、書目、URL、限制 → 來源筆記。</span><div class="back">欄位不完整 → 回來源取得。</div></div><div class="flow-step"><strong>02 · 整理並查詢 Wiki</strong><span>概念頁互連 → 依教學大綱選頁。</span><div class="back">證據不足 → 重查或補來源。</div></div><div class="flow-step gate"><strong>03 · 主張與證據閘門</strong><span>核對支持關係、適用範圍、自創示例標示。</span><div class="back">說法過廣 → 縮小主張後再審。</div></div><div class="flow-step"><strong>04 · 生成與瀏覽檢查</strong><span>HTML、鍵盤、搜尋、測驗、手機與列印。</span><div class="back">顯示或操作失敗 → 回 HTML 修正。</div></div></div>`;}
function slideBody(p){switch(p.type){
case 'hero':return `<div class="hero-bottom"><span class="big-rag">RAG</span><p>一次理解「檢索增強生成」<br>對象：第一次接觸 RAG 的你<br>概念 · 案例 · 小測驗 · 證據查核</p></div>`;

case 'compare':return `<div class="two-col"><div class="panel"><h3>LLM Wiki / 整理與保存</h3><p>來源筆記 → 概念頁 → 互相連結。</p><p>保留出處、適用範圍與更新紀錄。</p><span class="tag">本作業採用的工作定義</span></div><div class="panel dark"><h3>RAG / 取得與生成</h3><p>問題 → 檢索 → 使用取得的資料作答。</p><p>把外部知識帶進語言生成過程。</p><span class="tag">研究概念 / S01</span></div></div><div class="callout">本成果用 LLM 整理 Wiki 並生成簡報；網頁是離線教學成果，沒有線上聊天模型或向量資料庫。</div>`;
case 'ingest':return `<div class="two-col"><div>${DATA.sources.map(s=>`<div class="mini-source">${sourceLink(s.id)} <span>${esc(s.short)}</span></div>`).join('')}</div><div class="panel"><h3>每筆資料留下四件事</h3><p>① 來源與出版資訊<br>② 支持的概念<br>③ 不能推出的結論<br>④ 連到哪些 Wiki 頁</p><a href="#wiki">看八個 Wiki 概念頁 →</a></div></div><div class="callout">Ingest 範圍：六篇摘要與書目；不宣稱擷取全文。</div>`;
case 'retrieve':return `<label for="slide-search" class="small">在 Wiki 標題、摘要與內文搜尋</label><input class="search" id="slide-search" type="search" placeholder="例如：引用" autocomplete="off"><div id="slide-results" class="search-results">${searchResults('引用',4)}</div><p class="small" style="margin-top:15px">本互動使用關鍵詞匹配；DPR 是稠密表示檢索，兩者不同。相關性仍需要判斷。</p>`;
case 'example':return `<div class="two-col"><div class="record"><b>查到的紀錄（虛構）</b><code>K01｜週六：18:00 閉館</code><code>K02｜週日：17:00 閉館</code><p>問題：圖書館週末開到幾點？</p></div><div class="panel"><p class="good"><b>有根據的回答</b><br>週六 18:00 閉館 [K01]，週日 17:00 閉館 [K02]。</p><p class="bad"><b>沒有支持的新增細節</b><br>「圖書館週末全天 24 小時開放。」</p></div></div><div class="callout">兩筆公告只支持指定閉館時間；它們沒有支持「全天開放」。這是虛構教學案例。</div>`;
case 'citation':return cards(p.items)+`<div class="callout warning">「引用存在」是結構檢查；「引用支持這句話」是語意檢查。這份作業將兩者分開記錄。</div>`;
case 'limit':return `<p>Lost in the Middle 在受測模型與任務中，觀察到相關資訊位置影響表現。</p><div class="position-demo"><div><strong>開頭</strong><span>研究中較佳的資訊位置</span></div><div><strong>中段</strong><span>研究中表現下降</span></div><div><strong>結尾</strong><span>研究中較佳的資訊位置</span></div></div><p class="small">定性示意，非數據圖；沒有表示所有模型或相同下降幅度。</p><div class="callout">本作業的設計推論：先篩選相關證據，再交給生成步驟。這次沒有量測效能增益。</div>`;
case 'evaluation':return cards(p.items)+`<div class="callout">找不到資料 → 修資料或檢索；憑空加細節 → 修證據約束；難以理解 → 修教學與表達。</div>`;
case 'quiz':return `<div id="quiz-area">${quizHTML()}</div>`;
case 'flow':return flowCards()+`<p class="small" style="margin-top:16px">每類最多修正兩輪；仍無證據就移除主張並記錄。本 graph 借鏡反思概念，未實作 Self-RAG 模型。</p>`;
case 'run':return `<div class="run-stat"><div><strong>${DATA.run.sourceCount}</strong>來源匯入</div><div><strong>${DATA.run.wikiCount}</strong>Wiki 頁</div><div><strong>${DATA.run.claimCount}</strong>正式證據卡</div><div><strong>${DATA.run.rejected}/${DATA.run.boundaryCount}</strong>受控案例被攔截</div></div><p>每張正式投影片都有 Wiki 與證據卡對照，證據卡再連回第一手來源。</p><div class="callout warning">四個受控案例：兩項過度推論被攔截、兩項正確重述通過。這不是自然錯誤率，也不代表已量測長期表現。</div><p style="margin-top:20px"><a href="#report">開啟實際紀錄、審查理由與反思 →</a></p>`;
case 'reflection':return `<div class="two-col"><div class="panel"><h3>觀察到什麼？</h3><p>受控測試的兩項退回，都在主張整理：把引用當保證、把局部結果當通則。</p><p class="small">實際取得來源時，一個會議頁逾時，改用作者 arXiv 論文頁後完成。單次執行無法確認長期錯誤頻率。</p></div><div class="panel dark"><h3>改了什麼？</h3><p>初版：證據卡已有閘門，來源使用單一網址。</p><p>修正版：匯入前先確認來源可讀性，失敗就核對同篇第一手備援版本。</p></div></div><div class="callout">可讀性檢查提前到匯入前，證據與範圍檢查維持在排版前；本次未量測節省時間。</div>`;
case 'end':return `<div class="two-col"><div class="panel"><h3>一句話解釋 RAG</h3><p>讓模型使用檢索到的外部資料來組織回答。</p><h3>再多問一句</h3><p>來源是否支持這句話，以及這個適用範圍？</p></div><div class="panel dark"><h3>繼續探索</h3><p>查看概念頁、核對原始來源，或重做小測驗。</p><div class="actions"><a class="btn light" href="#wiki">讀 Wiki →</a><a class="btn light" href="#sources">看來源 →</a></div></div></div>`;
default:return '';}}
function evidence(p){const ss=[...new Set(p.claims.flatMap(id=>byId(DATA.claims,id).sources))];return `<div class="slide-evidence"><span>Wiki</span>${p.wiki.map(id=>`<a href="#wiki/${id}">${id}</a>`).join('')}<span>證據</span>${p.claims.map(id=>`<a href="#report/${id}">${id}</a>`).join('')}<span class="source-chips">原始來源 ${ss.map(sourceLink).join(' ')} · ${p.id}</span></div>`;}
function slide(p){return `<article class="slide ${p.type==='hero'?'hero-slide':''}" aria-label="${p.id} ${esc(p.title)}"><div class="eyebrow">${esc(p.label)}</div><h2>${esc(p.title)}</h2>${p.subtitle?`<p class="slide-sub">${esc(p.subtitle)}</p>`:''}<div class="slide-body">${slideBody(p)}</div>${evidence(p)}</article>`;}
function deck(n){n=Math.min(DATA.slides.length,Math.max(1,Number(n)||1));const p=DATA.slides[n-1];return `<div class="deck-layout"><aside class="deck-nav" aria-label="投影片目錄"><div class="nav-heading">學習路徑 / 15 SLIDES</div>${DATA.slides.map((x,i)=>`<a class="${i+1===n?'active':''}" href="#slides/${i+1}"><span>${String(i+1).padStart(2,'0')}</span>${esc(x.label.replace(/^\d+ \/ /,''))}</a>`).join('')}<div class="callout small" style="margin:22px 8px 0">點投影片底部編號，核對 Wiki、證據卡及來源。</div></aside><div class="deck-main">${slide(p)}<div class="deck-controls"><button class="btn" id="prev" ${n===1?'disabled':''}>← 上一頁</button><div class="progress" aria-label="簡報進度"><span style="width:${n/15*100}%"></span></div><span class="slide-no">${String(n).padStart(2,'0')} / 15</span><button class="btn primary" id="next" ${n===15?'disabled':''}>下一頁 →</button><button class="btn" id="fullscreen" aria-label="切換全螢幕">⛶</button><button class="btn" id="print">列印</button></div><details class="notes"><summary>講者筆記 <span class="key-hint">· 使用 ← → 方向鍵切換投影片</span></summary><p>${esc(p.notes)}</p></details></div></div>`;}
function searchResults(q,limit=20){const query=q.trim().toLowerCase();const found=DATA.wiki.filter(w=>!query||JSON.stringify([w.title,w.summary,w.blocks]).toLowerCase().includes(query));return found.length?found.slice(0,limit).map(w=>`<a class="result" href="#wiki/${w.id}"><b>${w.id} ${esc(w.title)}</b><span>${esc(w.summary)}</span></a>`).join(''):'<p role="status">找不到符合的頁面。請換一個關鍵詞；此處不生成無來源答案。</p>';}
function wikiPage(id){const w=byId(DATA.wiki,id);return `<div class="page"><div class="eyebrow">PERSISTENT KNOWLEDGE / LLM WIKI</div><div class="wiki-layout"><aside class="wiki-side" aria-label="Wiki 目錄"><a href="#wiki" class="${!w?'active':''}">全部概念頁</a>${DATA.wiki.map(x=>`<a href="#wiki/${x.id}" class="${x.id===id?'active':''}">${x.id} ${esc(x.title)}</a>`).join('')}</aside><div>${w?`<article class="wiki-article"><span class="tag">${w.id} · ${esc(w.tag)}</span><h1>${esc(w.title)}</h1><p class="lead">${esc(w.summary)}</p>${w.blocks.map(([h,t])=>`<section><h2>${esc(h)}</h2><p>${esc(t)}</p></section>`).join('')}<div class="related"><b>原始來源</b><p>${w.sources.length?w.sources.map(id=>sourceLink(id)+' '+esc(byId(DATA.sources,id).short)).join('<br>'):'本作業的操作定義與設計；無外部研究主張。'}</p><b>相關概念</b><div>${w.links.map(wikiLink).join('')}</div><b>使用此頁的投影片</b><div>${DATA.slides.filter(p=>p.wiki.includes(w.id)).map(p=>`<a href="#slides/${Number(p.id.slice(1))}">${p.id} ${esc(p.title.replace('\n',''))}</a>`).join('')}</div></div></article>`:`<h1>知識不是資料夾，<br>而是有連結的理解。</h1><p class="page-intro">AI 將六篇研究的摘要與書目整理為來源筆記，再綜整成八個概念頁。每頁保留原始來源、限制與相關概念，可回查也能繼續更新。</p><label for="wiki-search" class="small">搜尋概念與內文（關鍵詞匹配）</label><input id="wiki-search" class="search" type="search" placeholder="搜尋引用、檢索、長上下文…"><div id="wiki-results" class="wiki-grid">${DATA.wiki.map(x=>`<a href="#wiki/${x.id}" class="wiki-card"><span class="tag">${x.id} · ${esc(x.tag)}</span><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p></a>`).join('')}</div><div class="callout">匯入的是摘要與書目，不是論文全文。定義、類比、校園案例與流程規則均已標示為本作業設計。</div>`}</div></div></div>`;}
function graph(){return `<svg class="graph-svg" viewBox="0 0 850 770" role="img" aria-labelledby="graph-title"><title id="graph-title">取得資料、查來源、建 Wiki、查詢、檢查證據、產生 HTML 及瀏覽測試的回饋流程</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#526f5c" stroke-width="1.5"/></marker></defs><g fill="none" stroke="#526f5c" stroke-width="2" marker-end="url(#arrow)"><path d="M425 68 V100"/><path d="M425 170 V202"/><path d="M425 264 V296"/><path d="M425 358 V390"/><path d="M425 460 V492"/><path d="M425 554 V586"/><path d="M425 656 V688"/><path d="M295 135 H110 V38 H295"/><path d="M295 425 H140 V327 H295"/><path d="M555 621 H710 V523 H555"/></g><g font-family="Microsoft JhengHei,sans-serif" font-size="16" text-anchor="middle" fill="#173c37"><g fill="#edf0e5" stroke="#acb9a6"><rect x="295" y="6" width="260" height="62" rx="4"/><rect x="295" y="202" width="260" height="62" rx="4"/><rect x="295" y="296" width="260" height="62" rx="4"/><rect x="295" y="492" width="260" height="62" rx="4"/><rect x="295" y="688" width="260" height="62" rx="4"/></g><g fill="#e1eab7" stroke="#809461"><path d="M425 95 L555 135 L425 175 L295 135 Z"/><path d="M425 385 L555 425 L425 465 L295 425 Z"/><path d="M425 581 L555 621 L425 661 L295 621 Z"/></g><text x="425" y="44">取得資料</text><text x="425" y="142">來源可讀性與欄位檢查</text><text x="425" y="240">匯入筆記 / 綜整 Wiki</text><text x="425" y="334">查 Wiki / 整理證據卡</text><text x="425" y="432">支持與範圍檢查</text><text x="425" y="530">產生教學 HTML</text><text x="425" y="628">操作與顯示檢查</text><text x="425" y="726">成果 / 執行紀錄 / 反思</text><g font-size="12" fill="#a1462e"><text x="155" y="90">失敗 → 同篇備援來源</text><text x="151" y="385">不足 → 重查 / 縮小主張</text><text x="700" y="574">失敗 → 修 HTML</text></g><g font-size="11" fill="#61736b"><text x="455" y="191">通過</text><text x="455" y="482">通過</text><text x="455" y="680">通過</text></g></g></svg>`;}
function flowPage(){return `<div class="page"><div class="eyebrow">WORKFLOW / GRAPH DESIGN</div><h1>讓錯誤回到能修正它的地方。</h1><p class="page-intro">本次採用有條件分支的有向流程。來源、內容、顯示各自有檢查點，避免把所有問題留到最後才處理。</p>${graph()}${flowCards()}<div class="report-section"><h2>哪些步驟會重複？</h2><p>來源欄位缺失就補來源；主張沒有支持就重查 Wiki、補資料或縮小說法；顯示與操作失敗就只修 HTML。每類最多兩輪，仍缺證據時移除主張並留下紀錄。</p><h2>為什麼這樣設計？</h2><p>來源可讀性與欄位檢查要在 ingest 前完成；語意範圍要在排版前確認；畫面問題要在輸出後驗證。分開處理可以保留明確的回退理由。</p><div class="callout">實作界線：來源閱讀、概念綜整與語意審查由本次會話的 AI 完成；本地腳本重跑匯入、編號檢查、判斷紀錄重播及 HTML 生成，不會重新呼叫 LLM。這不是 Self-RAG 訓練模型。</div></div><a class="btn primary" href="#report">查看執行紀錄 →</a></div>`;}
function report(){return `<div class="page"><div class="eyebrow">ASSIGNMENT / EXECUTION / REFLECTION</div><h1>從來源到簡報的完整紀錄。</h1><p class="page-intro">主題：RAG 入門：讓 AI 查資料再回答。對象是初學者，透過概念、虛構校園案例、互動檢索與測驗，理解取得資料及核對證據的流程。</p><div class="actions"><a class="btn primary" href="#slides/1">教學簡報 →</a><a class="btn" href="#wiki">LLM Wiki →</a><button class="btn" id="download-log">下載執行 JSON</button></div><section class="report-section"><h2>01 / 先討論，再生成</h2>${DATA.brief.discussion.map(x=>`<div class="discussion"><strong>${esc(x.speaker)}</strong><p>${esc(x.text)}</p></div>`).join('')}</section><section class="report-section"><h2>02 / 實際執行與匯入成果</h2><div class="run-stat"><div><strong>${DATA.run.sourceCount}</strong>來源筆記</div><div><strong>${DATA.run.wikiCount}</strong>概念頁</div><div><strong>${DATA.run.claimCount}</strong>證據卡</div><div><strong>${DATA.run.slideCount}</strong>教學頁面</div></div><p class="small">執行開始：${esc(DATA.run.started)}（ISO 8601，UTC；查閱日期為臺北時間 2026-11-18）。</p><p>六篇來源均從第一手摘要頁讀取書目與摘要，整理成筆記後匯入。原文定位、限制、SHA-256 與概念連結保存在作業包。HTML 可獨立離線瀏覽，僅外部論文連結需要網路。</p><div class="table-wrap"><table><thead><tr><th>節點</th><th>實際結果</th><th>檢查方式</th></tr></thead><tbody><tr><td>來源匯入</td><td>6 / 6</td><td>URL、定位、摘要筆記、限制與雜湊</td></tr><tr><td>Wiki 綜整</td><td>8 / 8 概念頁</td><td>來源與互連頁編號檢查</td></tr><tr><td>正式主張</td><td>6 / 6 證據卡</td><td>本次 AI 逐卡查摘要，保留理由</td></tr><tr><td>投影片來源鏈</td><td>15 / 15</td><td>P → W → C → S 編號與包含關係</td></tr><tr><td>受控邊界案例</td><td>2 退回、2 通過</td><td>見下一節；不是自然錯誤統計</td></tr></tbody></table></div></section><section class="report-section"><h2>03 / 哪些主張被攔截？</h2><p>為檢查流程，主動設計四個邊界案例。下列判斷由本次 AI 閱讀來源後標註，腳本重播判斷與回退；腳本沒有自動證實語意。</p><div class="table-wrap"><table><thead><tr><th>案例</th><th>候選主張</th><th>結果與理由</th><th>修正</th></tr></thead><tbody>${DATA.auditCases.map(t=>`<tr><td>${t.id}<br>${sourceLink(t.source)}</td><td>${esc(t.candidate)}</td><td><span class="status ${t.verdict==='reject'?'reject':''}">${t.verdict==='reject'?'退回':'通過'}</span><p>${esc(t.reason)}</p></td><td>${esc(t.repair)}</td></tr>`).join('')}</tbody></table></div></section><section class="report-section"><h2>04 / 證據卡與來源對照</h2><div class="table-wrap"><table><thead><tr><th>證據</th><th>正式主張</th><th>Wiki / 來源</th><th>審查依據</th></tr></thead><tbody>${DATA.claims.map(c=>`<tr id="${c.id}"><td>${c.id}</td><td>${esc(c.text)}</td><td>${wikiLink(c.wiki)}<br>${c.sources.map(sourceLink).join(' ')}</td><td>${esc(c.support)}</td></tr>`).join('')}</tbody></table></div></section><section class="report-section"><h2>05 / 每張投影片從哪裡來？</h2><div class="table-wrap"><table><thead><tr><th>投影片</th><th>Wiki</th><th>證據卡</th><th>原始來源</th></tr></thead><tbody>${DATA.slides.map(p=>`<tr><td><a href="#slides/${Number(p.id.slice(1))}">${p.id} ${esc(p.title.replace('\n',''))}</a></td><td>${p.wiki.map(wikiLink).join('<br>')}</td><td>${p.claims.join('、')}</td><td>${[...new Set(p.claims.flatMap(id=>byId(DATA.claims,id).sources))].map(sourceLink).join(' ')}</td></tr>`).join('')}</tbody></table></div></section><section class="report-section"><h2>06 / 流程與反思</h2>${flowCards()}<div class="discussion"><strong>哪個節點最常出錯？</strong><p>本次取得來源時，一個 Self-RAG 會議摘要頁讀取逾時；改用作者 arXiv 頁後完成六筆匯入，見 logs/acquisition.json。受控測試另有兩項過度概括在主張整理被退回。這四例不是自然生成錯誤率。長期最常出錯的節點：【資料不足，無法確認】。</p></div><div class="discussion"><strong>檢查往前移到哪裡？</strong><p>初版已在證據卡建立後、HTML 生成前檢查支持與適用範圍。本次新增的是匯入前的來源可讀性檢查與備援路徑。受控案例確認必須先查支持與適用範圍；此外，在來源匯入前先檢查頁面能否讀取，失敗就改用同篇論文的作者版本。保留逐張 P→W→C→S 的包含關係檢查。</p></div><div class="discussion"><strong>有沒有改 graph？為什麼？</strong><p>有。在原有證據與顯示閘門之外，明確新增取得來源的失敗回退：讀取失敗先換同篇第一手版本，核對標題與作者後再匯入。這能在內容進入投影片前處理過度推論；本次沒有量測工時或準確率改善。</p></div></section><section class="report-section"><h2>07 / 執行界線與重跑方法</h2><p>規劃、來源閱讀、Wiki 綜整與語意審查由本次對話中的 AI 完成。沒有聲稱另一次使用者訪談、外部 LLM API 呼叫、向量資料庫、Self-RAG 訓練或 RAGAs 基準測試。</p><p>作業包包含 Markdown Wiki、來源筆記、流程圖原始碼、執行 JSON、證據與投影片對照、可重跑的 Node.js 腳本。使用 Node.js 22 或更新版本，在資料夾執行：</p><pre>node build.mjs\nnode verify.mjs\nnode server.mjs\n# 開啟 http://127.0.0.1:4187</pre><p class="small">重跑會更新生成時間與檢查結果，但不會重新瀏覽來源或重新執行語意模型。本次未完成瀏覽器視覺驗證：內建預覽分頁建立失敗，本地預覽請求受連線限制。結果詳見 logs/browser-check.json。程式結構檢查不等同語意正確，也不等同所有裝置已通過。全螢幕、手機實機與列印若未執行，均不列為已通過。</p></section><section class="report-section"><h2>08 / 繳交資訊</h2><p>標題範例：政大 ［學號於繳交平台填寫］ 資管四 ［姓名於繳交平台填寫］ RAG 入門：讓 AI 查資料再回答</p><p class="small">個人繳交資訊請於課程平台填寫，公開網站不包含姓名與學號。建議附上完整作業 ZIP，確保評閱者可直接離線開啟。原始檔與檢查紀錄另保存在 GitHub 儲存庫，亦可下載離線閱讀。</p></section></div>`;}
function sourcesPage(){return `<div class="page"><div class="eyebrow">PRIMARY SOURCES / INGEST MANIFEST</div><h1>每個概念，都能回到出處。</h1><p class="page-intro">六篇第一手研究；查閱日期 2026-11-18。匯入範圍為摘要與書目，以下筆記均為 AI 重述。研究結果與本作業的設計推論分別標示。</p>${DATA.sources.map(s=>`<article class="source-card" id="${s.id}"><span class="tag">${s.id} · ${esc(s.short)}</span><h2>${esc(s.title)}</h2><p>${esc(s.authors)} · ${esc(s.venue)}</p><p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">原始摘要與書目 ↗</a></p><p><b>匯入筆記：</b>${esc(s.note)}</p><p><b>限制：</b>${esc(s.limit)}</p><p class="small">定位：${esc(s.locator)}。行號依本次檢索輸出；請以 Abstract 標題與內容為準。</p><div class="related">概念頁：${s.concepts.map(wikiLink).join('')}</div></article>`).join('')}</div>`;}
function quizHTML(){const q=quizzes[quizAt],selected=quizAnswers[quizAt];return `<div class="quiz-tabs" aria-label="題目">${quizzes.map((_,i)=>`<button data-question="${i}" class="${i===quizAt?'active':''}" aria-label="第 ${i+1} 題">${i+1}</button>`).join('')}</div><p class="quiz-question">${esc(q.q)}</p><div class="quiz-options">${q.options.map((o,i)=>`<button class="quiz-option ${selected===i?'selected':''}" data-answer="${i}" aria-pressed="${selected===i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${selected===undefined?'':`<div class="quiz-feedback" role="status"><b>${selected===q.answer?'答對了。':'再看一次證據。'}</b> ${esc(q.why)}</div>`}`;}
function bindQuiz(){document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{quizAt=Number(b.dataset.question);$('#quiz-area').innerHTML=quizHTML();bindQuiz();});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{quizAnswers[quizAt]=Number(b.dataset.answer);$('#quiz-area').innerHTML=quizHTML();bindQuiz();});}
function render(){const [section,arg]=location.hash.slice(1).split('/');const valid=['home','slides','wiki','flow','report','sources'];const route=valid.includes(section)?section:'home';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.section===route));const n=Math.min(15,Math.max(1,Number(arg)||1));$('#main').innerHTML=route==='slides'?deck(n):route==='wiki'?wikiPage(arg):route==='flow'?flowPage():route==='report'?report():route==='sources'?sourcesPage():home();document.title=(route==='slides'?`第 ${n} 頁｜${DATA.slides[n-1].title.replace('\n','')}`:route==='wiki'&&byId(DATA.wiki,arg)?byId(DATA.wiki,arg).title:'RAG 學習實驗室')+'｜讓 AI 回答有來源';
 if($('#prev'))$('#prev').onclick=()=>location.hash=`slides/${n-1}`;
 if($('#next'))$('#next').onclick=()=>location.hash=`slides/${n+1}`;
 if($('#fullscreen'))$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('#fullscreen').textContent='不支援';}};
 if($('#print'))$('#print').onclick=()=>{window.print();};
 if($('#slide-search'))$('#slide-search').oninput=e=>$('#slide-results').innerHTML=searchResults(e.target.value,4);
 if($('#wiki-search'))$('#wiki-search').oninput=e=>$('#wiki-results').innerHTML=searchResults(e.target.value);
 if($('#quiz-area'))bindQuiz();
 if($('#download-log'))$('#download-log').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA.run,null,2)],{type:'application/json'}));a.download='rag-wiki-run.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
 window.scrollTo(0,0);if(arg&&['sources','report'].includes(route))document.getElementById(arg)?.scrollIntoView();}
window.addEventListener('hashchange',render);
window.addEventListener('keydown',e=>{if(!location.hash.startsWith('#slides/')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;const n=Number(location.hash.split('/')[1])||1;if(e.key==='ArrowRight'&&n<15){e.preventDefault();location.hash=`slides/${n+1}`;}if(e.key==='ArrowLeft'&&n>1){e.preventDefault();location.hash=`slides/${n-1}`;}if(e.key==='Home'){e.preventDefault();location.hash='slides/1';}if(e.key==='End'){e.preventDefault();location.hash='slides/15';}});
let prePrint=null;window.addEventListener('beforeprint',()=>{if(location.hash.startsWith('#slides/')){prePrint=$('#main').innerHTML;$('#main').innerHTML=DATA.slides.map(slide).join('');}});window.addEventListener('afterprint',()=>{if(prePrint!==null){prePrint=null;render();}});
render();
</script></body></html>
